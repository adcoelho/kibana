get:
  summary: Get maintenance window details
  operationId: getMaintenanceWindow
  description: You must have `read` privileges for the appropriate Kibana features.
  tags:
    - alerting
  parameters:
    - $ref: '../components/parameters/maintenance_window_id.yaml'
  responses:
    '200':
      description: Indicates a successful call.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/maintenance_window_response_properties.yaml'
    '400':
      description: Indicates an invalid schema or parameters.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/400_response.yaml'
    '403':
      description: Indicates that this call is forbidden.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/403_response.yaml'
    '404':
      description: Object is not found.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/404_response.yaml'

delete:
  summary: Delete a maintenance window
  operationId: deleteMaintenanceWindow
  description: >
    To delete a rule, you must have `all` privileges for the appropriate Kibana features.
    WARNING: After you delete a maintenance window, you cannot recover it.
  tags:
    - alerting
  parameters:
    - $ref: ../components/headers/kbn_xsrf.yaml
    - $ref: '../components/parameters/maintenance_window_id.yaml'
  responses:
    '204':
      description: Indicates a successful call.
    '400':
      description: Indicates an invalid schema or parameters.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/400_response.yaml'
    '403':
      description: Indicates that this call is forbidden.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/403_response.yaml'
    '404':
      description: Object is not found.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/404_response.yaml'
